# Builds a signed Echo Lap release and uploads it to App Store Connect (TestFlight), from a GitHub-hosted Mac.
# Runs only when started by hand: GitHub → Actions → "TestFlight upload" → Run workflow.
# Signing: each run uses the App Store Connect API key to create a short-lived Apple Distribution certificate and
# App Store profile (tools/ci/asc_signing.py) and signs with them; a later run removes them once Apple has processed the build.
#
# Needs these repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       App Store Connect API key ID (10 characters)
#   ASC_ISSUER_ID    Issuer ID shown above the keys list (a UUID)
#   ASC_KEY_P8       The whole text of the downloaded AuthKey_XXXXXXXXXX.p8 file, including the BEGIN/END lines
#   APPLE_TEAM_ID    Team ID from developer.apple.com → Account → Membership details (10 characters)
name: TestFlight upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version players see (for example 1.0). The build number goes up by itself.'
        required: true
        default: '1.0'

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the Apple secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see the top of .github/workflows/testflight.yml)"; exit 1; fi
          case "${{ inputs.version }}" in *[!0-9.]*|'') echo "::error::Version must look like 1.0 or 1.0.1"; exit 1;; esac

      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Game logic tests (EchoLapCore)
        working-directory: ios/EchoLapCore
        run: swift test -c release

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install the API key for this run only
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # A short-lived Apple Distribution certificate and App Store profile, made with the API key and removed at the end.
      # (Automatic signing would first need a development profile, which needs a registered iPhone.)
      - name: Create signing certificate and profile for this run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: store.numfall.echolap
          RUN_TAG: ${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -o pipefail
          python3 tools/ci/asc_signing.py setup "$RUNNER_TEMP/signing" | tee -a "$GITHUB_ENV"

      - name: Install them on this Mac
        run: |
          set -e
          S="$RUNNER_TEMP/signing"; KC="$RUNNER_TEMP/ci.keychain-db"; PW=$(uuidgen)
          echo "CI_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          /usr/bin/openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout pass:"$PW"
          security import "$S/dist.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$S/wwdr.cer" && security import "$S/wwdr.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$S/dist.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

      - name: Archive (Release, signed for the App Store)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EchoLap.xcodeproj \
            -scheme EchoLap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EchoLap.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ECHOLAP_PROFILE_NAME="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $CI_KEYCHAIN" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Check the signed app has Game Center
        run: |
          APP=$(find "$RUNNER_TEMP/EchoLap.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements :- "$APP" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.plist"
          grep -q com.apple.developer.game-center "$RUNNER_TEMP/entitlements.plist" || { echo "::error::The signed app is missing the Game Center entitlement. Check ios/project.yml entitlements and the App ID capabilities."; exit 1; }
          [ -f "$APP/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is not in the app bundle."; exit 1; }
          echo "Game Center entitlement and privacy manifest are present."

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>store.numfall.echolap</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EchoLap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"
          echo "Uploaded Echo Lap ${{ inputs.version }} (build $BUILD_NUMBER). It appears in App Store Connect → TestFlight after Apple finishes processing (usually 10 to 30 minutes)."

      # The certificate and profile stay in the account for now: Apple checks the signature while it processes the
      # upload, so revoking them here makes the build fail ("90035 Invalid Signature"; learned on NumFall). The next run removes them.
      - name: Remove the keychain and key from this Mac
        if: always()
        run: |
          [ -n "$CI_KEYCHAIN" ] && security delete-keychain "$CI_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
