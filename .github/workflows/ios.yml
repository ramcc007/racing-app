# Builds and tests the Echo Lap iPhone/iPad app on a GitHub-hosted Mac, so no local Mac is needed.
#   1. Game-logic tests (EchoLapCore: physics, echoes, every rule, all 120 tracks driven by the robot, rewards).
#   2. Builds the app for the iOS Simulator.
#   3. UI tests on an iPhone simulator: intro → first race → results → every menu, pause/restart/quit.
#   4. Screenshots on iPhone Pro Max, a small iPhone and iPad, kept as a downloadable artifact.
# No code signing and no upload to Apple here: signed uploads to TestFlight are in testflight.yml (started by hand).
name: iOS build

on:
  push:
    branches: ['claude/**', main]
    paths: ['ios/**', 'tools/ci/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'tools/ci/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Game logic tests and Release build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Game logic tests (EchoLapCore)
        working-directory: ios/EchoLapCore
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tee "$RUNNER_TEMP/core-tests.log"

      # The App Store build: Release configuration for real devices, unsigned here (testflight.yml signs it). Catches
      # anything that only compiles in Debug (screenshot and UI-test helpers are compiled out of Release).
      - name: Release build for devices (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild build \
            -project EchoLap.xcodeproj \
            -scheme EchoLap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/release-build.log" | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/release-build.log" || { grep -E "error:" "$RUNNER_TEMP/release-build.log" | sort -u | head -80; exit 1; }
          APP=$(find "$RUNNER_TEMP/dd-release/Build/Products/Release-iphoneos" -maxdepth 1 -name EchoLap.app | head -1)
          [ -f "$APP/PrivacyInfo.xcprivacy" ] && echo "Privacy manifest is in the bundle." || { echo "::error::PrivacyInfo.xcprivacy missing from the app bundle"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" -c "Print :ITSAppUsesNonExemptEncryption" -c "Print :UILaunchScreen" "$APP/Info.plist"
          xcodebuild -version

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: |
            ${{ runner.temp }}/core-tests.log
            ${{ runner.temp }}/release-build.log
          if-no-files-found: ignore

  app:
    name: App build, UI tests and screenshots
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      contents: write   # only for the optional [screens] commit of small screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the app for the iOS Simulator
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project EchoLap.xcodeproj \
            -scheme EchoLap \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' \
            2>&1 | tee "$RUNNER_TEMP/app-build.log" | grep -E "error:|warning: .*(deprecated|will never)|BUILD|\*\*" || true
          grep -q "TEST BUILD SUCCEEDED\|BUILD SUCCEEDED" "$RUNNER_TEMP/app-build.log" || { grep -E "error:" "$RUNNER_TEMP/app-build.log" | sort -u | head -150; exit 1; }

      - name: UI tests on an iPhone simulator
        id: uitests
        working-directory: ios
        timeout-minutes: 30
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro \(" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -E "iPhone" | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $UDID"
          # Boot the simulator first and wait until it is really ready, so the first test's app launch is not the
          # thing that pays for a cold simulator.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
          run_tests() {   # $@: extra xcodebuild arguments (e.g. -only-testing for a rerun)
            rm -rf "$RUNNER_TEMP/UITests.xcresult"
            xcodebuild test-without-building \
              -project EchoLap.xcodeproj \
              -scheme EchoLap \
              -destination "id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
              "$@" \
              > "$RUNNER_TEMP/ui-tests.log" 2>&1 || true
            grep -E "Test Case .*(passed|failed)|: error: " "$RUNNER_TEMP/ui-tests.log" || true
          }
          run_tests
          # A test whose app never got a process ID died before its body ran: run just those once more.
          DEAD=$(grep -E "does not have a process ID" "$RUNNER_TEMP/ui-tests.log" | sed -E 's/.*-\[EchoLapUITests\.([A-Za-z]+) ([A-Za-z]+)\].*/\1\/\2/' | sort -u)
          if [ -n "$DEAD" ]; then
            echo "Rerunning tests whose app did not launch: $DEAD"
            cp "$RUNNER_TEMP/ui-tests.log" "$RUNNER_TEMP/ui-tests-first.log"
            ARGS=(); for t in $DEAD; do ARGS+=(-only-testing:"EchoLapUITests/$t"); done
            run_tests "${ARGS[@]}"
            # The rerun must pass, and the only failures in the first log must be the tests that never launched.
            grep -q "TEST EXECUTE SUCCEEDED\|\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/ui-tests.log"
            FIRST_FAILED=$(grep -cE "Test Case .*failed" "$RUNNER_TEMP/ui-tests-first.log" || true)
            [ "$FIRST_FAILED" -eq "$(echo "$DEAD" | wc -l | tr -d ' ')" ]
            exit $?
          fi
          grep -q "TEST EXECUTE SUCCEEDED\|\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/ui-tests.log"

      - name: Collect the UI test screenshots
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          [ -d "$RUNNER_TEMP/UITests.xcresult" ] || exit 0
          mkdir -p "$RUNNER_TEMP/ui-test-raw" "$RUNNER_TEMP/ui-test-screens"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/UITests.xcresult" --output-path "$RUNNER_TEMP/ui-test-raw" > /dev/null 2>&1 || true
          python3 tools/ci/pick_attachments.py "$RUNNER_TEMP/ui-test-raw" "$RUNNER_TEMP/ui-test-screens"

      - name: Screenshots, iPhone 6.9-inch
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name EchoLap.app -path '*Debug-iphonesimulator*' | head -1)
          bash tools/ci/screenshots.sh "$APP" "$RUNNER_TEMP/screenshots" phone > "$RUNNER_TEMP/screenshots-phone.log" 2>&1; tail -15 "$RUNNER_TEMP/screenshots-phone.log"

      - name: Screenshots, small iPhone
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name EchoLap.app -path '*Debug-iphonesimulator*' | head -1)
          bash tools/ci/screenshots.sh "$APP" "$RUNNER_TEMP/screenshots" small > "$RUNNER_TEMP/screenshots-small.log" 2>&1; tail -15 "$RUNNER_TEMP/screenshots-small.log"

      - name: Screenshots, iPad 13-inch
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name EchoLap.app -path '*Debug-iphonesimulator*' | head -1)
          bash tools/ci/screenshots.sh "$APP" "$RUNNER_TEMP/screenshots" pad > "$RUNNER_TEMP/screenshots-pad.log" 2>&1; tail -15 "$RUNNER_TEMP/screenshots-pad.log"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/ui-test-screens
          if-no-files-found: ignore

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/app-build.log
            ${{ runner.temp }}/ui-tests.log
            ${{ runner.temp }}/ui-tests-first.log
            ${{ runner.temp }}/screenshots-*.log
          if-no-files-found: ignore

      # Commits small JPEG copies to ci-screens/ on this branch when the commit message contains [screens] (or the run
      # was started by hand), so the screens can be reviewed without downloading artifacts. [skip ci] avoids a loop.
      - name: Share small screenshots in the branch
        if: always() && steps.build.outcome == 'success' && (contains(github.event.head_commit.message, '[screens]') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          rm -rf ci-screens && mkdir -p ci-screens
          for f in "$RUNNER_TEMP"/screenshots/*.png "$RUNNER_TEMP"/ui-test-screens/*.png; do
            [ -f "$f" ] || continue
            sips -Z 900 -s format jpeg -s formatOptions 55 "$f" --out "ci-screens/$(basename "${f%.png}").jpg" > /dev/null
          done
          ls ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ci-screens
          git commit -q -m "CI screenshots for ${GITHUB_SHA::7} [skip ci]" && git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Test summary
        if: always()
        run: |
          echo "=== UI tests ==="
          [ -f "$RUNNER_TEMP/ui-tests.log" ] && grep -E "Test Case .*(passed|failed)|: error: |TEST (EXECUTE )?(SUCCEEDED|FAILED)" "$RUNNER_TEMP/ui-tests.log" | cut -c1-400 | tail -40 || echo "(not run)"
          echo "=== Screenshots ==="
          ls "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/ui-test-screens" 2>/dev/null || true
