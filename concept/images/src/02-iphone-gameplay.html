<!doctype html><meta charset="utf-8">
<body><script src="lib.js"></script><script src="config.js"></script><script>
// iPhone 6.9" portrait, mid-race, World 1 (Harbour). Camera points the car "up".
const W = 1320, H = 2868;
const s = svgRoot(W, H, '#5C8F5A');
const defs = el('defs', {}, s);

// Ground: quay concrete with water on the left.
el('rect', { width: W, height: H, fill: '#C9C2B4' }, s);
for (let y = 0; y < H; y += 120) el('line', { x1: 0, y1: y, x2: W, y2: y, stroke: 'rgba(0,0,0,.05)', 'stroke-width': 3 }, s);
const water = 'M0 0 L250 0 Q300 700 190 1300 Q120 1900 260 2868 L0 2868 Z';
el('path', { d: water, fill: '#2F7FB5' }, s);
for (let k = 0; k < 40; k++) {
  const y = 60 + k * 70, x = 40 + (k * 53) % 150;
  el('path', { d: `M${x} ${y} q20 -12 40 0 t40 0`, fill: 'none', stroke: 'rgba(255,255,255,.35)', 'stroke-width': 5, 'stroke-linecap': 'round' }, s);
}
el('path', { d: water, fill: 'none', stroke: '#8A8478', 'stroke-width': 18 }, s);

// Track in screen space (open spline running up the screen).
const ctrl = [[700, 3150], [690, 2550], [560, 2000], [700, 1450], [930, 950], [820, 420], [640, -250]];
const pts = spline(ctrl, 60, false);

// Side shortcut lane with gate, joining back further up.
const sc = spline([[640, 2200], [900, 1950], [1100, 1600], [1110, 1200], [940, 930]], 40, false);
el('path', { d: pathD(sc, false), fill: 'none', stroke: '#E8E4DA', 'stroke-width': 210, 'stroke-linecap': 'round' }, s);
el('path', { d: pathD(sc, false), fill: 'none', stroke: '#3B3F47', 'stroke-width': 180, 'stroke-linecap': 'round' }, s);
el('path', { d: pathD(sc, false), fill: 'none', stroke: '#F2A93B', 'stroke-width': 8, 'stroke-dasharray': '30 26' }, s);

// Containers and a crane on the quay.
const cols = ['#E07A3F', '#3F8FD2', '#E3B341', '#4CB28B', '#C9544B'];
[[1040, 2500, 0], [1080, 2620, 2], [330, 380, 1], [340, 520, 3], [1120, 520, 4], [1170, 2300, 1], [360, 2650, 4]].forEach(([x, y, c]) => {
  el('rect', { x: x - 110 + 10, y: y - 40 + 14, width: 220, height: 80, rx: 6, fill: 'rgba(0,0,0,.22)' }, s);
  el('rect', { x: x - 110, y: y - 40, width: 220, height: 80, rx: 6, fill: cols[c] }, s);
  for (let k = 1; k < 8; k++) el('line', { x1: x - 110 + k * 27, y1: y - 34, x2: x - 110 + k * 27, y2: y + 34, stroke: 'rgba(0,0,0,.16)', 'stroke-width': 4 }, s);
});
el('rect', { x: 330, y: 1000, width: 40, height: 520, fill: 'rgba(0,0,0,.18)', transform: 'translate(18 24)' }, s);
el('rect', { x: 330, y: 1000, width: 40, height: 520, fill: '#E3B341' }, s);
el('rect', { x: 200, y: 1000, width: 300, height: 46, fill: '#E3B341' }, s);

road(s, pts, { width: 300, closed: false, asphalt: '#3B3F47' });

// Gate on the shortcut, held open by echo 2 sitting on its pad.
const gp = sc[92];
el('rect', { x: gp[0] - 120, y: gp[1] - 16, width: 30, height: 120, rx: 10, fill: '#2FA36B' }, s);
el('rect', { x: gp[0] + 90, y: gp[1] - 16, width: 30, height: 120, rx: 10, fill: '#2FA36B' }, s);
const pad = sc[48];
el('rect', { x: pad[0] - 90, y: pad[1] - 60, width: 180, height: 120, rx: 18, fill: '#2FA36B' }, s);
const e2 = { x: pad[0], y: pad[1] };
car(s, e2.x, e2.y, -100, ECHO[1], { scale: 2.1, opacity: 0.85, label: '2', noShadow: true });

// Echo 3 ahead on the racing line (slipstream target), echo 1 behind.
echo(s, pts, 0.47, 3, { offset: -40, trail: 0.06, scale: 2.1, trailWidth: 48, wobble: 4 });
echo(s, pts, 0.285, 1, { offset: 60, trail: 0.05, scale: 2.1, trailWidth: 48, wobble: 4 });

// Player, with slipstream streaks.
const P = along(pts, 0.40, -30);
for (let k = 0; k < 7; k++) {
  const q = along(pts, 0.415 + k * 0.006, (k % 2 ? 40 : -100));
  el('line', { x1: q.x, y1: q.y - 30, x2: q.x, y2: q.y + 30, stroke: '#fff', 'stroke-width': 7, 'stroke-linecap': 'round', opacity: 0.7, transform: `rotate(${q.a + 90} ${q.x} ${q.y})` }, s);
}
car(s, P.x, P.y, P.a, '#F5F7FA', { scale: 2.3, canopy: '#0E1B2A' });

// ---------- HUD ----------
// Top bar (no status bar in store screenshots).
panel(s, 48, 150, 300, 120, { r: 60 });
text(s, 198, 200, 'LAP', { size: 30, weight: 700, anchor: 'middle', fill: '#9FB2C4' });
text(s, 198, 250, '4 / 6', { size: 52, weight: 900, anchor: 'middle' });
panel(s, 380, 150, 560, 120, { r: 60 });
text(s, 660, 232, '0:41.27', { size: 76, weight: 900, anchor: 'middle', family: 'Inter Display' });
panel(s, 972, 150, 300, 120, { r: 60 });
star(s, 1030, 210, 26, '#F2C94C');
text(s, 1180, 228, '−0.42', { size: 50, weight: 900, anchor: 'middle', fill: '#5BD08D' });

// Echo strip: where each past lap is relative to you right now.
panel(s, 48, 300, 1224, 110, { r: 55 });
text(s, 90, 368, 'ECHOES', { size: 28, weight: 800, fill: '#9FB2C4', spacing: 2 });
[['1', '+1.9 s', ECHO[0]], ['2', 'on pad', ECHO[1]], ['3', '−0.3 s', ECHO[2]]].forEach(([n, t, c], i) => {
  const x = 330 + i * 310;
  el('circle', { cx: x, cy: 355, r: 30, fill: c }, s);
  text(s, x, 367, n, { size: 32, weight: 900, anchor: 'middle', fill: '#111' });
  text(s, x + 50, 368, t, { size: 34, weight: 700, fill: '#fff' });
});

// Hint bubble for the first time a gate is open.
const bx = W - 610, by = pad[1] + 150;
panel(s, bx, by, 560, 150, { r: 30, fill: 'rgba(20,90,60,.92)', stroke: 'rgba(255,255,255,.3)' });
text(s, bx + 280, by + 62, 'Echo 2 is holding', { size: 40, weight: 800, anchor: 'middle' });
text(s, bx + 280, by + 116, 'the shortcut open ↑', { size: 40, weight: 800, anchor: 'middle' });

// Boost meter + controls hint.
panel(s, 48, 2520, 1224, 230, { r: 48, fill: 'rgba(12,14,20,.62)' });
text(s, 100, 2590, 'BOOST', { size: 34, weight: 900, fill: '#F2A93B', spacing: 2 });
el('rect', { x: 100, y: 2615, width: 800, height: 46, rx: 23, fill: 'rgba(255,255,255,.14)' }, s);
el('rect', { x: 100, y: 2615, width: 610, height: 46, rx: 23, fill: '#F2A93B' }, s);
text(s, 100, 2715, 'Hold & slide to steer  ·  swipe up to boost', { size: 30, weight: 600, fill: '#C9D6E3' });
el('circle', { cx: 1110, cy: 2635, r: 86, fill: '#F2A93B' }, s);
el('path', { d: 'M1110 2585 L1150 2650 L1124 2650 L1124 2685 L1096 2685 L1096 2650 L1070 2650 Z', fill: '#1B2430' }, s);

// Thumb hint: touch point with a slide arrow.
el('circle', { cx: 760, cy: 2380, r: 70, fill: 'rgba(255,255,255,.25)', stroke: 'rgba(255,255,255,.7)', 'stroke-width': 5 }, s);
el('path', { d: 'M570 2380 L660 2380 M950 2380 L860 2380', stroke: 'rgba(255,255,255,.8)', 'stroke-width': 10, 'stroke-linecap': 'round' }, s);
el('path', { d: 'M590 2350 L560 2380 L590 2410 M930 2350 L960 2380 L930 2410', fill: 'none', stroke: 'rgba(255,255,255,.8)', 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);

stamp(s, W, H - 40);
</script></body>
