<!doctype html><meta charset="utf-8">
<body><script src="lib.js"></script><script src="config.js"></script><script src="worlds.js"></script><script>
const W = 2400, H = 1600;
const s = svgRoot(W, H, '#14171D');
text(s, 80, 110, 'Eight worlds, eight ways the track changes', { size: 64, weight: 900, family: 'Inter Display' });
text(s, 80, 165, '15 tracks each (120 total) plus a daily track. Each world adds one rule that works with your echoes.', { size: 32, weight: 500, fill: '#9AA6B4' });

const TW = 535, TH = 640, GX = 80, GY = 220, GAP = 30;
WORLDS.forEach((w, i) => {
  const col = i % 4, row = Math.floor(i / 4);
  const x = GX + col * (TW + GAP), y = GY + row * (TH + GAP);
  const clip = 'c' + i;
  const defs = el('defs', {}, s);
  el('rect', { id: clip + 'r', x, y, width: TW, height: TH, rx: 30 }, el('clipPath', { id: clip }, defs));
  const g = el('g', { 'clip-path': `url(#${clip})` }, s);
  el('rect', { x, y, width: TW, height: TH, fill: w.ground }, g);
  const r = rng(100 + i);
  decorate(g, w, x, y, TW, TH - 170, r);
  const tr = rng(7 + i * 13);
  const pts = spline([-60, 110, 280, 440, 620].map((dx, k) => [x + dx + (tr() - 0.5) * 60, y + 90 + tr() * 330]), 50, false);
  road(g, pts, { width: 92, closed: false, asphalt: w.asphalt, kerbB: w.kerbB });
  if (w.deco === 'ice') {
    const p = along(pts, 0.55);
    el('path', { d: `M${p.x - 30} ${p.y - 20} l18 16 l-10 14 l26 10 M${p.x + 4} ${p.y - 26} l-6 22`, fill: 'none', stroke: '#E8F6FF', 'stroke-width': 4 }, g);
  }
  if (w.deco === 'neon') {
    const p = along(pts, 0.62);
    el('rect', { x: p.x - 36, y: p.y - 24, width: 72, height: 48, rx: 8, fill: '#2FA36B' }, g);
  }
  echo(g, pts, 0.62, (i % 6) + 1, { trail: 0.12, scale: 0.9, offset: 10 });
  const p = along(pts, 0.36, -14);
  car(g, p.x, p.y, p.a, '#F5F7FA', { scale: 0.9 });
  // Caption band.
  el('rect', { x, y: y + TH - 170, width: TW, height: 170, fill: 'rgba(10,12,16,.86)' }, g);
  text(g, x + 30, y + TH - 118, `WORLD ${w.n}`, { size: 22, weight: 800, fill: w.accent === '#FFFFFF' ? '#9FD3F0' : w.accent, spacing: 3 });
  text(g, x + 30, y + TH - 76, w.name, { size: 40, weight: 900 });
  text(g, x + 30, y + TH - 38, w.mech, { size: 26, weight: 700, fill: '#E6EBF0' });
  text(g, x + 30, y + TH - 10, w.note, { size: 19, weight: 500, fill: '#9AA6B4' });
});
stamp(s, W, H, true);
</script></body>
